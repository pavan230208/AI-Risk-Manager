name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ai_risk_user
          POSTGRES_PASSWORD: safe_test_password
          POSTGRES_DB: ai_risk_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        
    - name: Run Database Migrations
      env:
        DATABASE_URL: postgresql://ai_risk_user:safe_test_password@localhost/ai_risk_manager_test
      run: |
        cd backend
        alembic upgrade head
        
    - name: Run Pytest
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql://ai_risk_user:safe_test_password@localhost/ai_risk_manager_test
        REDIS_URL: redis://localhost:6379/0
        EVENT_BUS_BACKEND: redis
        USE_FAKEREDIS: 0
        JWT_SECRET: super_secret_for_tests_that_is_long_enough
      run: |
        pytest backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build
      run: |
        cd frontend
        npm run build
